{% extends "base.html" %}
{% block content %}
<div class="container-fluid">
  <h4>KK Radio 설정</h4>
  <form id="kr-settings">
    <div class="form-group">
      <label>User-Agent</label>
      <input class="form-control" name="user_agent" value="{{ arg.user_agent|e }}">
      <small class="form-text text-muted">KRadio 방식처럼 API와 실제 스트림 요청에 동일하게 적용합니다.</small>
    </div>
    <div class="form-group">
      <label>비활성 채널 ID</label>
      <input class="form-control" name="disabled_channels" value="{{ arg.disabled_channels|e }}" placeholder="id1,id2,id3">
      <small class="form-text text-muted">쉼표로 구분합니다. 비활성 채널은 전체/묶음 M3U에서 제외됩니다.</small>
    </div>
    <div class="form-group">
      <label>전체 M3U</label>
      <input class="form-control" readonly value="{{ arg.api_m3u|e }}">
    </div>
    <button class="btn btn-primary" type="submit">저장</button><span id="kr-result" class="ml-3"></span>
  </form>
</div>
<script>
$('#kr-settings').on('submit',function(e){e.preventDefault();var x=$('#kr-result').text('저장 중...');$.post('/ff_kkradio/ajax/save',$(this).serialize()).done(function(r){x.text(r.message||'저장 완료');}).fail(function(){x.text('저장 실패');});});
</script>
{% endblock %}
